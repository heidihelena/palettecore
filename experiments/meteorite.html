<title>Meteorite — Söderfjärden, and the record it left</title>
<!--
  Meteorite — exogenous discontinuity, after Söderfjärden.

  The fourth piece of the series, and the pair to volcano.html. It runs the
  same instrument over a different process, and the difference between the
  two panels is the argument.

  ARRIVAL. Impacts are drawn from a memoryless (exponential) process at a
  fixed rate. The hazard is CONSTANT: the expected wait to the next impact is
  the same at every instant, no matter how long the sky has been empty and no
  matter what is on screen. There is no state that rises beforehand, because
  there is no state. The instrument plots the hazard as the flat line it is.
  Nothing here predicts the next strike, and that is a property of the
  process rather than a difficulty of watching.

  THE RECORD. The crater the strike leaves is modelled on Söderfjärden, in
  Ostrobothnia about 10 km south of Vaasa, so the piece shows what an
  exogenous event actually leaves behind rather than an invented hole. The
  geometry below is the published geometry, and the cross-section carries a
  stated vertical exaggeration because the real structure is far wider than
  it is deep.

    apparent diameter   6.55 km (earlier estimates 5.5-6.6 km)
    maximum depth       ~300 m
    rim                 ~55 m, preserved by burial soon after impact
    central uplift      Precambrian granite, buried
    fill                Cambrian sandstone and shale
    surface today       drained farmland, kept dry by a pump station

  And this is why the piece runs deep time after the strike. The structure is
  invisible from the ground: it was noticed as a circle in Landsat imagery in
  1975 (Talvitie et al.), and the impact origin was only confirmed in 1985
  (Lehtovaara) on shock evidence, planar deformation features in quartz,
  kink bands in mica, polymict breccia in the drill cores. Its age is still
  contested: 40Ar/39Ar on clast-rich impact melt rock gives a range of
  640-1880 Ma, against an older reading in the Cambrian.

  So the exogenous case makes a sharper claim than "it could not be
  predicted". It also could not be READ for a very long time, and became
  legible only from a new vantage point and with physical evidence that had
  to be looked for. Its date is not settled now. The volcano is a risk that
  was present and could have been read; the meteorite is uncertainty that
  could not have been known, whose record then takes a change of instrument
  to recover, and remains uncertain after that.

  Sources: Impact Earth database entry for Söderfjärden (impact.uwo.ca);
  Wikipedia, Söderfjärden; Öhman 2013 on shock features in quartz from
  Saarijärvi and Söderfjärden. Figures are reported as published, including
  the disagreement.

  Colours come from the four-class C-D-G-A ladder generated and audited by
  experiments/discontinuity.py (output/discontinuity.json), the ladder that
  survives simulated dichromacy. Each impact sounds one note of it, drawn
  independently of everything else.
-->

(() => {
"use strict";
if (!DATA) { document.getElementById("title").textContent =
  "palette not injected — run experiments/discontinuity.py"; return; }

const LADDER = DATA.ladder;
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const TOP = LADDER.length - 1;

// ---------- Söderfjärden's geometry, as published --------------------------
// Apparent diameter 6.55 km, maximum depth ~300 m, rim ~55 m above the floor
// level, buried central uplift of Precambrian granite. The structure is 22
// times wider than it is deep, so the cross-section states its exaggeration
// rather than quietly flattering the hole.
const KM = 6.55, DEPTH_M = 300, RIM_M = 55, VE = 6;   // VE = vertical exaggeration
const SPAN_KM = 11;                                   // how much ground is in view

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, HORIZON = 0;
let stars = [];
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  HORIZON = H * 0.62;                    // surface line; bedrock is cut away below
  // A quiet sky. Nothing here carries information about arrivals.
  const n = Math.max(260, Math.min(1200, Math.round(W * H / 2600)));
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * W,
    y: Math.random() * HORIZON * 0.94,
    a: 0.10 + Math.random() * 0.34,
    tw: Math.random() * 6.283,
  }));
}
resize();
window.addEventListener("resize", resize);

// ---------- the process ----------------------------------------------------
// Memoryless arrivals: the wait to the next impact is exponential with a fixed
// rate, so the hazard is constant. This is the whole difference from the
// volcano, and it is a property of the draw, not of the drawing.
const RATE = 1 / 26;                      // impacts per second (mean wait 26 s)
const MEAN_WAIT = 1 / RATE;
let nextIn = -Math.log(1 - Math.random()) / RATE;
let sinceLast = 0, count = 0, waitSum = 0;
let clock = 0, flash = 0, lastNote = 0;

const trace = [];                         // arrivals only; there is no state to plot
const TRACE_SPAN = 90;

// ---------- the record ----------------------------------------------------
// After a strike the piece runs deep time: the crater fills, the rim buries,
// and the surface returns to a flat plain. Söderfjärden is farmland now; the
// circle was invisible from the ground until Landsat imagery showed it in
// 1975, and the impact origin was confirmed on shock evidence in 1985.
let crater = null;      // {age Ma, fill 0..1, cx}
const MA_PER_SEC = 62;  // deep time, compressed
const RECOGNISED_MA = 640;   // the youngest end of the contested Ar-Ar range

// ---------- the strike -----------------------------------------------------
let streak = null;                        // the incoming object, visible for a fraction of a second
let parts = [];
function impact() {
  count += 1;
  waitSum += sinceLast;
  trace.push({ t: clock });
  while (trace.length && trace[0].t < clock - TRACE_SPAN - 5) trace.shift();
  sinceLast = 0;
  nextIn = -Math.log(1 - Math.random()) / RATE;

  // The note is drawn independently too: nothing about the strike is a
  // function of anything the visitor could have been watching.
  lastNote = (Math.random() * LADDER.length) | 0;
  const ix = W * (0.30 + Math.random() * 0.40);
  crater = { age: 0, fill: 0, cx: ix };
  const from = { x: ix - W * 0.22, y: -H * 0.1 };
  streak = { x0: from.x, y0: from.y, x1: ix, y1: HORIZON, life: 0, max: 0.34 };
  flash = 1;

  const [r, g, b] = hexRgb(LADDER[lastNote].hex);
  for (let i = 0; i < 260; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.3;
    const sp = 120 + Math.random() * 620;
    parts.push({
      x: ix, y: HORIZON,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0, max: 0.9 + Math.random() * 2.0, r, g, b,
    });
  }
  if (parts.length > 1600) parts.splice(0, parts.length - 1600);
  playStrike(LADDER[lastNote]);
}

// ---------- sound ----------------------------------------------------------
let ac = null, master = null, soundOn = false, noiseBuf = null;
function audioInit() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.0001; master.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, 2 * ac.sampleRate, ac.sampleRate);
  const ch = noiseBuf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
}
function playStrike(entry) {
  if (!ac || !soundOn) return;
  const when = ac.currentTime;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.16, when + 0.008);   // no approach, only arrival
  g.gain.exponentialRampToValueAtTime(0.0001, when + 3.4);
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = Math.min(4200, entry.f * 5);
  for (const [type, mul, gain] of [["sine", 1, 1], ["sine", 0.5, 0.7], ["triangle", 2, 0.3]]) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.value = entry.f * mul;
    const og = ac.createGain(); og.gain.value = gain;
    o.connect(og).connect(lp); o.start(when); o.stop(when + 3.6);
  }
  lp.connect(g).connect(master);
  const br = ac.createBufferSource(); br.buffer = noiseBuf;
  const bf = ac.createBiquadFilter(); bf.type = "lowpass"; bf.frequency.value = 900;
  const bg = ac.createGain();
  bg.gain.setValueAtTime(0.16, when);
  bg.gain.exponentialRampToValueAtTime(0.0001, when + 1.5);
  br.connect(bf).connect(bg).connect(master);
  br.start(when); br.stop(when + 1.6);
}

// ---------- draw -----------------------------------------------------------
function drawScene(dt) {
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    s.tw += dt * 0.7;
    const a = s.a * (0.72 + 0.28 * Math.sin(s.tw));
    ctx.fillStyle = `rgba(190,186,200,${a.toFixed(3)})`;
    ctx.fillRect(s.x, s.y, 1.4, 1.4);
  }

  const [r, g, b] = hexRgb(LADDER[lastNote].hex);

  if (flash > 0) {
    flash = Math.max(0, flash - dt * 1.9);
    const gl = ctx.createLinearGradient(0, HORIZON - H * 0.5, 0, HORIZON);
    gl.addColorStop(0, "rgba(0,0,0,0)");
    gl.addColorStop(1, `rgba(${r},${g},${b},${(0.42 * flash).toFixed(3)})`);
    ctx.fillStyle = gl;
    ctx.fillRect(0, HORIZON - H * 0.5, W, H * 0.5);
  }

  if (streak) {
    streak.life += dt;
    const k = 1 - streak.life / streak.max;
    if (k <= 0) streak = null;
    else {
      ctx.strokeStyle = `rgba(255,255,255,${(0.85 * k).toFixed(3)})`;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(streak.x0 + (streak.x1 - streak.x0) * (1 - k) * 0.82,
                 streak.y0 + (streak.y1 - streak.y0) * (1 - k) * 0.82);
      ctx.lineTo(streak.x1, streak.y1);
      ctx.stroke();
    }
  }

  for (const p of parts) {
    p.life += dt;
    p.vy += 520 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const k = 1 - p.life / p.max;
    if (k <= 0) continue;
    const w = Math.min(0.8, k * 0.8);
    ctx.fillStyle = `rgba(${Math.round(p.r + (255 - p.r) * w)},${
      Math.round(p.g + (255 - p.g) * w)},${Math.round(p.b + (255 - p.b) * w)},${
      (0.2 + 0.7 * k).toFixed(3)})`;
    ctx.fillRect(p.x, p.y, 2.2, 2.2);
  }
  parts = parts.filter(p => p.life < p.max && p.y < H + 40);

  drawGround();
}

// The cross-section. Depths are the published ones, scaled by the stated
// vertical exaggeration; the crater profile is a bowl with a raised rim and a
// central uplift, which is the shape the drill cores describe.
function pxPerKm() { return W / SPAN_KM; }
function mToPx(m) { return (m / 1000) * pxPerKm() * VE; }

function craterFloor(x) {
  if (!crater) return 0;                      // metres below the surface datum
  const halfPx = (KM / 2) * pxPerKm();
  const u = (x - crater.cx) / halfPx;         // -1..1 across the crater
  if (Math.abs(u) > 1.28) return 0;
  if (Math.abs(u) > 1) {                      // the rim, outside the bowl
    const k = (1.28 - Math.abs(u)) / 0.28;
    return -RIM_M * Math.sin(k * Math.PI) * 0.9;
  }
  const bowl = DEPTH_M * (1 - u * u);
  const uplift = DEPTH_M * 0.42 * Math.exp(-Math.pow(u / 0.24, 2));  // central uplift
  return Math.max(0, bowl - uplift);
}

function drawGround() {
  // bedrock
  ctx.fillStyle = "rgba(18,15,23,0.99)";
  ctx.fillRect(0, HORIZON, W, H - HORIZON);

  if (!crater) {
    ctx.strokeStyle = "rgba(120,113,133,0.5)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, HORIZON); ctx.lineTo(W, HORIZON); ctx.stroke();
    return;
  }

  // the excavated structure, cut into the bedrock
  const [r, g, b] = hexRgb(LADDER[lastNote].hex);
  ctx.beginPath();
  ctx.moveTo(0, HORIZON);
  for (let x = 0; x <= W; x += 3) ctx.lineTo(x, HORIZON + mToPx(craterFloor(x)));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = "rgba(26,22,32,1)";
  ctx.fill();

  // the fill: Cambrian sandstone and shale, arriving over deep time
  if (crater.fill > 0) {
    // Sandstone and shale accumulate on the crater floor and rise toward the
    // datum, so this band sits above the floor line, not below it.
    ctx.fillStyle = "rgba(58,50,64,0.96)";
    for (let x = 0; x <= W; x += 3) {
      const d = craterFloor(x);
      if (d <= 0) continue;
      const floorY = HORIZON + mToPx(d);
      const topY = HORIZON + mToPx(d * (1 - crater.fill));
      ctx.fillRect(x, topY, 3.4, floorY - topY);
    }
  }

  // the structure's outline, still warm early on and cooling as time runs
  const heat = Math.max(0, 1 - crater.age / 40);
  ctx.strokeStyle = heat > 0.02
    ? `rgba(${r},${g},${b},${(0.20 + 0.6 * heat).toFixed(3)})`
    : "rgba(120,113,133,0.42)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 3) {
    const y = HORIZON + mToPx(craterFloor(x));
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // the present-day surface: once the fill is complete this is flat farmland,
  // and the structure below it stops being visible from here at all.
  if (crater.fill > 0.55) {
    const a = Math.min(0.75, (crater.fill - 0.55) / 0.45);
    ctx.strokeStyle = `rgba(150,143,162,${(0.28 + 0.5 * a).toFixed(3)})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, HORIZON); ctx.lineTo(W, HORIZON); ctx.stroke();
  }
}

// ---------- the instrument -------------------------------------------------
// Same panel as the volcano, deliberately. There the trace climbs before an
// eruption; here it is flat, because a memoryless process has no precursor.
const tctx = document.getElementById("trace").getContext("2d");
function drawTrace() {
  const w = 536, h = 124;
  tctx.clearRect(0, 0, w, h);
  const t0 = clock - TRACE_SPAN;
  const x = t => ((t - t0) / TRACE_SPAN) * w;

  tctx.strokeStyle = "rgba(240,198,116,0.55)";
  tctx.setLineDash([5, 5]); tctx.lineWidth = 2;
  tctx.beginPath(); tctx.moveTo(0, 26); tctx.lineTo(w, 26); tctx.stroke();
  tctx.setLineDash([]);

  for (const p of trace) {
    if (p.t < t0) continue;
    tctx.strokeStyle = "rgba(207,201,194,0.5)"; tctx.lineWidth = 2;
    tctx.beginPath(); tctx.moveTo(x(p.t), 4); tctx.lineTo(x(p.t), h - 4); tctx.stroke();
  }

  // the hazard: constant, and therefore a straight line at every instant
  tctx.strokeStyle = "rgba(207,201,194,0.9)"; tctx.lineWidth = 2.4;
  const y = h - 8 - (RATE / 0.1) * (h - 34);
  tctx.beginPath(); tctx.moveTo(0, y); tctx.lineTo(w, y); tctx.stroke();
}

const el = id => document.getElementById(id);
function updatePanel() {
  el("v-hazard").textContent = RATE.toFixed(2);
  el("v-since").textContent = `${sinceLast.toFixed(0)} s`;
  el("v-mean").textContent = count ? `${(waitSum / count).toFixed(1)} s` : "—";
  el("v-count").textContent = String(count);
  el("verdict").textContent = count < 3
    ? `the hazard is flat. the expected wait is ${MEAN_WAIT.toFixed(0)} s from any instant.`
    : `waiting longer does not bring it closer: still ${MEAN_WAIT.toFixed(0)} s expected, ` +
      `from now, as from the start.`;

  const rec = el("record");
  if (!crater) {
    el("v-age").textContent = "—";
    el("v-rim").textContent = "—";
    el("v-fill").textContent = "—";
    rec.className = "";
    rec.textContent = "no structure yet.";
  } else {
    const rimLeft = RIM_M * (1 - crater.fill);
    el("v-age").textContent = `${Math.round(crater.age)} Ma`;
    el("v-rim").textContent = `${rimLeft.toFixed(0)} m`;
    el("v-fill").textContent = `${Math.round(crater.fill * 100)} %`;
    if (crater.fill < 0.55) {
      rec.className = "";
      rec.textContent = "the structure is open. sandstone and shale are filling it.";
    } else if (crater.age < RECOGNISED_MA) {
      rec.className = "";
      rec.textContent = "buried. from the ground this is a flat plain, and nothing "
        + "at the surface says an impact happened here.";
    } else {
      rec.className = "found";
      rec.textContent = "the circle was seen from orbit in 1975 and the impact origin "
        + "confirmed on shocked quartz in 1985. the date is still contested: "
        + "640 to 1880 Ma.";
    }
  }
  const e = LADDER[lastNote];
  const [r, g, b] = hexRgb(e.hex);
  el("note").innerHTML = `<span style="color:rgb(${r},${g},${b})">&#9679;</span> ${e.note}`;
}

// ---------- loop -----------------------------------------------------------
let prev = null, playing = true;
function frame(ms) {
  if (prev === null) prev = ms;
  const dt = Math.min(0.05, (ms - prev) / 1000); prev = ms;
  if (playing) {
    clock += dt; sinceLast += dt; nextIn -= dt;
    if (nextIn <= 0) impact();
    if (crater) {
      crater.age += MA_PER_SEC * dt;
      // Burial was fast, which is why the rim survived at all; the plain took
      // very much longer to become a plain.
      crater.fill = Math.min(1, 1 - Math.exp(-crater.age / 55));
    }
  }
  el("scalebar").textContent = crater
    ? `${KM} km across  ·  ${DEPTH_M} m deep  ·  vertical exaggeration ${VE}×`
    : "";
  drawScene(dt);
  drawTrace();
  updatePanel();
  requestAnimationFrame(frame);
}

el("pause").addEventListener("click", ev => {
  playing = !playing;
  ev.target.textContent = playing ? "pause" : "resume";
});
el("sound").addEventListener("click", ev => {
  if (!ac) audioInit();
  if (ac.state === "suspended") ac.resume();
  soundOn = !soundOn;
  master.gain.setTargetAtTime(soundOn ? 0.85 : 0.0001, ac.currentTime, 0.2);
  ev.target.textContent = soundOn ? "sound off" : "sound on";
});

const hud = document.getElementById("hud");
let restTimer = null;
function wake() {
  hud.classList.remove("rest");
  clearTimeout(restTimer);
  restTimer = setTimeout(() => hud.classList.add("rest"), 6000);
}
window.addEventListener("pointermove", wake);
wake();

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
