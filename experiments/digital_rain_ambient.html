<!--
  Digital rain — ambient variant.

  Fullscreen, edge to edge, almost no text: the rain alone, as background
  sound-and-colour for working. Forty-eight notes, C2..B5, each column
  carrying one note of the palettecore pitch-colour helix (hue = pitch class,
  lightness = absolute pitch); the note sounds as the drop reaches the
  bottom. C2 falls first and the rain introduces all forty-eight in order
  before running free. Click anywhere for sound. The interface fades away
  when the pointer rests.

  Colours are injected by experiments/digital_rain.py from the palettecore
  engine (audit in output/digital_rain.json). The full study, with the
  vision toggles that show the audit's result, is digital_rain.html.

  No recording hooks here, unlike waves_ambient.html: the rain is meant never
  to repeat, so there is no deterministic frame to render a seamless loop
  from. Rendering a rain video means capturing a real run.
-->

(() => {
"use strict";
if (!DATA) { document.getElementById("title").textContent =
  "palette not injected — run experiments/digital_rain.py"; return; }

const NOTES = DATA.notes;                 // C2..B5, 48 entries
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

// The alphabet the code is written in: pitch-class letters, the accidentals,
// the octave digits this piece spans, and a few rule glyphs for texture.
const GLYPHS = [..."ABCDEFG", "♯", "♭", ..."2345", ..."│─┼·•▫▪"];
const glyph = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");
const CELL = 19, COLW = 24;
let W = 0, H = 0, COLS = 0, ROWS = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  COLS = Math.max(1, Math.floor(W / COLW));
  ROWS = Math.max(1, Math.floor(H / CELL));
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
}
resize();
window.addEventListener("resize", resize);

// ---------- the fall -------------------------------------------------------
let drops = [], released = 0, intro = true;
let sinceRelease = 0, sinceSpawn = 0, lastNote = 0;
const RELEASE_GAP = 0.30, SPAWN_GAP = 0.055, MAX_DROPS = 420;

function spawn(noteIdx) {
  const len = 10 + ((Math.random() * 16) | 0);
  drops.push({
    note: noteIdx, col: (Math.random() * COLS) | 0,
    y: -len * CELL * Math.random(),
    speed: 85 + Math.random() * 120, len,
    chars: Array.from({ length: len }, glyph), struck: false,
  });
  if (drops.length > MAX_DROPS) drops.shift();
}

// ---------- sound: the note sounds when the drop lands ---------------------
let ac = null, master = null, sound = false;
function audioInit() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
}
function strike(entry) {
  if (!ac || !sound) return;
  const when = ac.currentTime, g = ac.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.07, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 2.1);
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = Math.min(5200, entry.f * 7);
  for (const [type, det, gain] of [["sine", 0, 1], ["triangle", 4, 0.4]]) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.value = entry.f; o.detune.value = det;
    const og = ac.createGain(); og.gain.value = gain;
    o.connect(og).connect(lp); o.start(when); o.stop(when + 2.3);
  }
  lp.connect(g).connect(master);
}

// ---------- loop -----------------------------------------------------------
const hud = document.getElementById("hud");
const noteEl = document.getElementById("note");
const hintEl = document.getElementById("hint");
let prev = null;

function frame(ms) {
  if (prev === null) prev = ms;
  const dt = Math.min(0.05, (ms - prev) / 1000); prev = ms;

  if (intro) {
    sinceRelease += dt;
    if (sinceRelease >= RELEASE_GAP) {
      sinceRelease = 0; spawn(released); released += 1;
      if (released >= NOTES.length) intro = false;
    }
  }
  sinceSpawn += dt;
  if (sinceSpawn >= SPAWN_GAP && released > 0) {
    sinceSpawn = 0;
    spawn((Math.random() * (intro ? released : NOTES.length)) | 0);
  }

  ctx.fillStyle = "rgba(0,0,0,0.11)";
  ctx.fillRect(0, 0, W, H);
  ctx.font = `500 ${CELL - 3}px "Nudica Mono", ui-monospace, monospace`;
  ctx.textBaseline = "top";

  for (const d of drops) {
    d.y += d.speed * dt;
    const [r, g, b] = hexRgb(NOTES[d.note].hex);
    const headRow = Math.floor(d.y / CELL);
    for (let k = 0; k < d.len; k++) {
      const row = headRow - k;
      if (row < 0 || row >= ROWS) continue;
      const fade = Math.pow(1 - k / d.len, 1.5);
      const w = k === 0 ? 0.8 : k === 1 ? 0.36 : 0;
      ctx.fillStyle = `rgba(${Math.round(r + (255 - r) * w)},${
        Math.round(g + (255 - g) * w)},${Math.round(b + (255 - b) * w)},${
        (0.14 + 0.86 * fade).toFixed(3)})`;
      if (Math.random() < 0.03) d.chars[k] = glyph();
      ctx.fillText(d.chars[k], d.col * COLW + 5, row * CELL);
    }
    if (!d.struck && d.y >= H) { d.struck = true; lastNote = d.note; strike(NOTES[d.note]); }
  }
  drops = drops.filter(d => d.y - d.len * CELL < H + CELL);

  const e = NOTES[lastNote];
  const [r, g, b] = hexRgb(e.hex);
  noteEl.innerHTML = `<span style="color:rgb(${r},${g},${b})">&#9679;</span> ${e.note}`;
  requestAnimationFrame(frame);
}

document.body.addEventListener("click", () => {
  if (!ac) { audioInit(); sound = true; hintEl.style.display = "none"; }
  else { sound = !sound; if (ac.state === "suspended") ac.resume(); }
});

let restTimer = null;
function wake() {
  hud.classList.remove("rest");
  clearTimeout(restTimer);
  restTimer = setTimeout(() => hud.classList.add("rest"), 4000);
}
window.addEventListener("pointermove", wake);
wake();

requestAnimationFrame(frame);
})();
</script>
