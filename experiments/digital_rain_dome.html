<title>digital rain — dome</title>
<!--
  Digital rain — fulldome build.

  Same forty-eight notes, same audited colours, projected for a planetarium
  dome instead of a flat screen. The viewer lies under it and the rain falls
  around them from the zenith out to the horizon.

  WHY THIS IS A PROJECTION CHANGE AND NOT A REWRITE. Every piece in this
  series draws individual points from a formula rather than compositing
  images, so the artwork is defined in its own coordinates and only meets the
  screen at the last step. Swapping that last step for a fisheye mapping
  moves the whole piece into the dome and leaves the note walk, the palette
  and the audit untouched. In the flat build a drop travels down a column; in
  this one it travels outward along a bearing. Nothing else changes.

    flat:  column c, row r      ->  x = c*COLW,  y = r*CELL
    dome:  bearing θ, depth d   ->  r = d * R,   x = cx + r*sin θ,
                                                 y = cy - r*cos θ

  OUTPUT. This renders a domemaster: a square frame carrying a 180 degree
  circular fisheye, centre of the image at the zenith, edge of the circle at
  the horizon. That is the standard interchange format for dome theatres, so
  a venue can either run this page live or capture frames from it. Set SIZE
  to the dome's resolution before capturing; 4096 is the common 4K delivery
  and Wisdome Stockholm is near 5K, so 5120 suits it.

  Add ?size=4096 to the URL to override, and ?grid=1 to draw the horizon
  circle and the cardinal bearings while aligning the projector.

  UNVERIFIED, AND IT MATTERS: no dome has confirmed a spec for this yet.
  Resolution, frame rate, whether they take a live browser source or only
  pre-rendered frames, and whether the dome is tilted rather than horizontal
  all change the delivery. A tilted dome in particular moves the useful
  centre of the image away from the zenith, and this build assumes a
  horizontal dome. Ask before rendering anything final.

  Colours are injected by experiments/digital_rain.py exactly as in the flat
  builds, so the dome version cannot drift from the audit either.
-->

    display: flex; align-items: center; justify-content: center;
  }
  /* The domemaster is square. On a flat monitor it is letterboxed; on the
     dome it fills the hemisphere. */
  canvas { display: block; max-width: 100vmin; max-height: 100vmin; background: #000; }

(() => {
"use strict";
if (!DATA) { document.title = "palette not injected"; return; }

const NOTES = DATA.notes;                  // C2..B5, 48 entries
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const GLYPHS = [..."ABCDEFG", "♯", "♭", ..."2345", ..."│─┼·•▫▪"];
const glyph = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

const params = new URLSearchParams(location.search);
const SIZE = Math.max(512, parseInt(params.get("size") || "2048", 10));
const SHOW_GRID = params.get("grid") === "1";

const canvas = document.getElementById("dome");
canvas.width = canvas.height = SIZE;
const ctx = canvas.getContext("2d");
const CX = SIZE / 2, CY = SIZE / 2;
const R = SIZE / 2;                        // horizon sits on the circle edge

// Bearings around the dome. More bearings than a flat build has columns,
// because the horizon circumference is longer than a screen is wide.
const BEARINGS = 260;
// Spacing is a fraction of the current radius rather than a fixed number of
// pixels. Glyphs grow as they fall, so a constant step would overlap them at
// the rim and the drop would read as a solid bar rather than as falling code.
const SPACING = 0.052;

// ---------- the fall, in dome coordinates ---------------------------------
// A drop owns a bearing and a depth. Depth 0 is the zenith, depth 1 the
// horizon. Radius grows with depth, so glyphs spread apart as they fall,
// which is what rain actually does when you are standing in it.
let drops = [], released = 0, intro = true;
let sinceRelease = 0, sinceSpawn = 0;
const RELEASE_GAP = 0.30, SPAWN_GAP = 0.085, MAX_DROPS = 300;

function spawn(noteIdx) {
  const len = 8 + ((Math.random() * 14) | 0);
  drops.push({
    note: noteIdx,
    bearing: ((Math.random() * BEARINGS) | 0) / BEARINGS * Math.PI * 2,
    depth: 0.02 + Math.random() * 0.05,
    speed: 0.055 + Math.random() * 0.075,  // fraction of the radius per second
    len,
    chars: Array.from({ length: len }, glyph),
  });
  if (drops.length > MAX_DROPS) drops.shift();
}

function drawGrid() {
  ctx.strokeStyle = "rgba(140,133,155,0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, R - 1, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, R / 2, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.sin(a) * R, CY - Math.cos(a) * R);
    ctx.stroke();
  }
}

let prev = null;
function frame(ms) {
  if (prev === null) prev = ms;
  const dt = Math.min(0.05, (ms - prev) / 1000); prev = ms;

  if (intro) {
    sinceRelease += dt;
    if (sinceRelease >= RELEASE_GAP) {
      sinceRelease = 0; spawn(released); released += 1;
      if (released >= NOTES.length) intro = false;
    }
  }
  sinceSpawn += dt;
  if (sinceSpawn >= SPAWN_GAP && released > 0) {
    sinceSpawn = 0;
    spawn((Math.random() * (intro ? released : NOTES.length)) | 0);
  }

  // The trail wipe is a disc, not a rectangle, so the area outside the
  // horizon circle stays true black. Anything painted out there would spill
  // off the dome and onto the room.
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(0,0,0,0.34)";
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (const d of drops) {
    d.depth += d.speed * dt;
    const [r0, g0, b0] = hexRgb(NOTES[d.note].hex);
    const sinB = Math.sin(d.bearing), cosB = Math.cos(d.bearing);

    for (let k = 0; k < d.len; k++) {
      const depth = d.depth * (1 - k * SPACING);
      if (depth <= 0.015 || depth > 1) continue;
      const rad = depth * R;
      const x = CX + sinB * rad, y = CY - cosB * rad;

      // Glyphs grow toward the horizon, which is the perspective a viewer
      // under the dome expects, and it also keeps the zenith from clotting.
      const size = 6 + 26 * depth;
      const fade = Math.pow(1 - k / d.len, 1.5);
      const w = k === 0 ? 0.8 : k === 1 ? 0.36 : 0;
      ctx.fillStyle = `rgba(${Math.round(r0 + (255 - r0) * w)},${
        Math.round(g0 + (255 - g0) * w)},${Math.round(b0 + (255 - b0) * w)},${
        (0.14 + 0.86 * fade).toFixed(3)})`;

      // Each glyph is turned to stand upright for a viewer facing that
      // bearing, so the code reads the same wherever you sit.
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(d.bearing);
      ctx.font = `500 ${size.toFixed(1)}px "Nudica Mono", ui-monospace, monospace`;
      if (Math.random() < 0.03) d.chars[k] = glyph();
      ctx.fillText(d.chars[k], 0, 0);
      ctx.restore();
    }
  }
  drops = drops.filter(d => d.depth * (1 - d.len * SPACING) < 1.02);

  if (SHOW_GRID) drawGrid();
  requestAnimationFrame(frame);
}

ctx.fillStyle = "#000";
ctx.fillRect(0, 0, SIZE, SIZE);
requestAnimationFrame(frame);
})();
