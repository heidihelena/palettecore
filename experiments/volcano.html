<title>Volcano — Svartsengi, and a threshold that is a band</title>
<!--
  Volcano — endogenous discontinuity, after Svartsengi and the Sundhnúkur
  crater row.

  The third piece of the series, and the pair to meteorite.html. Both carry
  the same instrument panel and the same cross-section view; the difference
  between the two panels is the argument.

  THE SYSTEM. Magma accumulates in a shallow reservoir beneath Svartsengi on
  the Reykjanes peninsula, at roughly 4 to 5 km depth. The reservoir inflates,
  the ground above it rises measurably, and when enough magma has gathered a
  dyke propagates and erupts along the Sundhnúkur crater row a few kilometres
  away. The reservoir drains, the ground drops, and accumulation starts over.
  That cycle has repeated many times since December 2023, which is why this
  system rather than a generic cone: the precursor is not hypothetical here.
  It was measured, published and acted on, over and over.

  So the hazard is a rising function of an OBSERVABLE state, and the piece
  plots that state. Accumulated volume is the state; uplift rate and
  seismicity near the crater row rise with it; the panel shows all three
  while they climb.

  THE PART THAT MATTERS MOST. The eruption threshold is not a line. It is a
  band, and the band moved. Geodetic models put the volume needed for the
  early events at roughly 8 to 13 million cubic metres; later in the series
  the estimate was revised upward, to roughly 12 to 15 million. The inflow
  rate, around 3 cubic metres per second, itself declined gradually across the
  series. Forecasts were published as rising probability over a window, never
  as a date.

  This piece therefore draws the threshold as a band rather than a line,
  erupts at a volume drawn from inside it, moves the band between cycles, and
  reports afterwards where in the band that eruption actually fell. Over a few
  cycles the visitor sees the precursor work and the gate stay uncertain at
  the same time. A warning you can read is a different thing from a date you
  can name, and a piece that erupted on a crisp line would argue something
  false.

  Sources: Icelandic Meteorological Office (en.vedur.is) news and deformation
  updates on magma accumulation beneath Svartsengi and the Sundhnúkur series.
  Figures are reported as published, as ranges, including the revision.

  Colours come from the four-class C-D-G-A ladder generated and audited by
  experiments/discontinuity.py (output/discontinuity.json). This is a piece
  about whether a signal could have been read, so it uses the ladder that
  survives simulated dichromacy rather than the chromatic one that collapses.
  Note height carries accumulated volume: the emptier the system after an
  eruption, the lower the note, and the refill sounds as the ladder climbing.
-->

(() => {
"use strict";
if (!DATA) { document.getElementById("title").textContent =
  "palette not injected — run experiments/discontinuity.py"; return; }

const LADDER = DATA.ladder;
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const TOP = LADDER.length - 1;
const el = id => document.getElementById(id);

// ---------- the system, in the published units ----------------------------
// Volume is the state: millions of cubic metres accumulated in the shallow
// reservoir. The band is the volume range that has preceded eruptions, and it
// is a range because that is what the geodetic models give, not a line.
let band = { lo: 8, hi: 13 };             // Mm³, the early-series estimate
let volume = 0.6;
let inflow = 0.235;                       // Mm³ per second of sim time
const RESERVOIR_KM = 4.5;                 // depth of the accumulating body
const SPAN_KM = 12;                       // ground in view

let erupting = 0, count = 0, clock = 0;
let erupted = [];                         // {vol, lo, hi} per eruption, for the read-back
const trace = [];                         // {t, volume, erupt}
const TRACE_SPAN = 110;
let sinceSample = 0;

function hazardOf(v) {
  // Zero below the band, rising across it. The band is the claim: an eruption
  // inside it is expected, and its exact volume is not predictable.
  if (v <= band.lo) return 0;
  const u = Math.min(1, (v - band.lo) / (band.hi - band.lo));
  return Math.pow(u, 2.1) * 0.52;
}
function upliftRate() {
  // Ground rise above an inflating reservoir, in mm per day of the model.
  return erupting > 0 ? -46 : 3.2 + 5.4 * (volume / band.hi);
}
function quakeRate() {
  return 4 + 128 * Math.pow(Math.max(0, volume - band.lo * 0.55) / band.hi, 2.3);
}

// ---------- scene ----------------------------------------------------------
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, SURF = 0, CX = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  SURF = H * 0.42;                        // surface line; the crust is cut away below
  CX = W * 0.40;                          // reservoir centre
}
resize();
window.addEventListener("resize", resize);
const pxPerKm = () => W / SPAN_KM;
const ROW_X = () => CX + pxPerKm() * 3.1; // the crater row, a few km along

let parts = [];                           // erupting lava and ash
let dyke = 0;                             // 0..1, the dyke travelling to the row

function noteForVolume() {
  return Math.min(TOP, Math.max(0, Math.round((volume / band.hi) * TOP)));
}

function erupt() {
  // The eruption happens somewhere in the band, not at a fixed value. Where in
  // the band is exactly what the model cannot tell you in advance.
  count += 1;
  erupted.push({ vol: volume, lo: band.lo, hi: band.hi });
  if (erupted.length > 6) erupted.shift();
  erupting = 4.2 + Math.random() * 2.4;
  dyke = 0;
  trace.push({ t: clock, volume, erupt: true });
  playBurst();
}

function fountain(power) {
  const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.7;
  const sp = (150 + Math.random() * 400) * power;
  parts.push({
    x: ROW_X() + (Math.random() - 0.5) * pxPerKm() * 1.1, y: SURF,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    life: 0, max: 1.3 + Math.random() * 2.0,
    note: Math.min(TOP, 8 + ((Math.random() * (TOP - 7)) | 0)),
    ash: Math.random() < 0.38,
  });
  if (parts.length > 1300) parts.shift();
}

function drawScene(dt) {
  ctx.fillStyle = "rgba(0,0,0,0.26)";
  ctx.fillRect(0, 0, W, H);

  const [r, g, b] = hexRgb(LADDER[noteForVolume()].hex);
  const load = Math.min(1.4, volume / band.hi);

  ctx.fillStyle = "rgba(8,7,12,0.9)";
  ctx.fillRect(0, 0, W, SURF);
  ctx.fillStyle = "rgba(18,15,23,0.99)";
  ctx.fillRect(0, SURF, W, H - SURF);

  // the reservoir: a body that swells as magma accumulates
  const ry = SURF + (RESERVOIR_KM / SPAN_KM) * W * 0.62;
  const rw = pxPerKm() * (1.5 + 1.5 * load);
  const rh = 9 + 30 * load;
  const glow = ctx.createRadialGradient(CX, ry, 0, CX, ry, rw * 1.5);
  glow.addColorStop(0, `rgba(${r},${g},${b},${(0.30 + 0.5 * load).toFixed(3)})`);
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(CX - rw * 1.6, ry - rw * 1.6, rw * 3.2, rw * 3.2);
  // Drawn as a grain rather than a solid, so the reservoir belongs to the same
  // visual language as the sea, the rain and the ejecta.
  ctx.fillStyle = `rgba(${r},${g},${b},0.6)`;
  for (let i = 0; i < 900; i++) {
    const a = (i * 2.399963);                        // golden-angle scatter
    const rr = Math.sqrt((i + 0.5) / 900);
    ctx.fillRect(CX + Math.cos(a) * rr * rw, ry + Math.sin(a) * rr * rh, 1.9, 1.9);
  }

  // the ground above it rises, exaggerated, and the panel says so
  ctx.strokeStyle = "rgba(150,143,162,0.55)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 4) {
    const d = (x - CX) / (pxPerKm() * 2.6);
    ctx.lineTo(x, SURF - 26 * load * Math.exp(-d * d));
  }
  ctx.stroke();

  // the crater row
  const rx = ROW_X();
  ctx.strokeStyle = erupting > 0 ? `rgba(${r},${g},${b},0.9)` : "rgba(120,113,133,0.5)";
  ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(rx + i * 16 - 6, SURF - 5);
    ctx.lineTo(rx + i * 16, SURF - 12);
    ctx.lineTo(rx + i * 16 + 6, SURF - 5);
    ctx.stroke();
  }

  // the dyke travels laterally from the reservoir and up to the row
  if (erupting > 0) {
    dyke = Math.min(1, dyke + dt * 1.5);
    ctx.strokeStyle = `rgba(${r},${g},${b},0.8)`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(CX, ry);
    ctx.lineTo(CX + (rx - CX) * dyke, ry - (ry - SURF) * dyke);
    ctx.stroke();
    if (dyke >= 1) for (let i = 0; i < 7; i++) fountain(1);
  }

  for (const p of parts) {
    p.life += dt;
    p.vy += 560 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const k = 1 - p.life / p.max;
    if (k <= 0) continue;
    if (p.ash) {
      ctx.fillStyle = `rgba(150,142,158,${(0.28 * k).toFixed(3)})`;
    } else {
      const [pr, pg, pb] = hexRgb(LADDER[p.note].hex);
      const w = Math.min(0.78, k * 0.78);
      ctx.fillStyle = `rgba(${Math.round(pr + (255 - pr) * w)},${
        Math.round(pg + (255 - pg) * w)},${Math.round(pb + (255 - pb) * w)},${
        (0.25 + 0.7 * k).toFixed(3)})`;
    }
    ctx.fillRect(p.x, p.y, p.ash ? 2.6 : 2.2, p.ash ? 2.6 : 2.2);
  }
  parts = parts.filter(p => p.life < p.max && p.y < H + 40);
}

// ---------- the instrument -------------------------------------------------
const tctx = document.getElementById("trace").getContext("2d");
function drawTrace() {
  const w = 548, h = 136;
  tctx.clearRect(0, 0, w, h);
  const t0 = clock - TRACE_SPAN;
  const x = t => ((t - t0) / TRACE_SPAN) * w;
  const top = Math.max(band.hi * 1.25, 17);
  const y = v => h - 8 - (v / top) * (h - 20);

  // the band, drawn as the band it is
  tctx.fillStyle = "rgba(240,198,116,0.15)";
  tctx.fillRect(0, y(band.hi), w, y(band.lo) - y(band.hi));
  tctx.strokeStyle = "rgba(240,198,116,0.45)";
  tctx.setLineDash([5, 5]); tctx.lineWidth = 1.6;
  for (const v of [band.lo, band.hi]) {
    tctx.beginPath(); tctx.moveTo(0, y(v)); tctx.lineTo(w, y(v)); tctx.stroke();
  }
  tctx.setLineDash([]);

  for (const p of trace) {
    if (!p.erupt || p.t < t0) continue;
    tctx.strokeStyle = "rgba(207,201,194,0.5)"; tctx.lineWidth = 2;
    tctx.beginPath(); tctx.moveTo(x(p.t), 4); tctx.lineTo(x(p.t), h - 4); tctx.stroke();
  }

  tctx.strokeStyle = "rgba(207,201,194,0.9)"; tctx.lineWidth = 2.4;
  tctx.beginPath();
  let started = false;
  for (const p of trace) {
    if (p.t < t0) continue;
    const px = x(p.t), py = y(p.volume);
    if (!started) { tctx.moveTo(px, py); started = true; } else tctx.lineTo(px, py);
  }
  tctx.stroke();
}

function updatePanel() {
  el("v-vol").textContent = `${volume.toFixed(1)} Mm³`;
  el("v-band").textContent = `${band.lo.toFixed(0)}–${band.hi.toFixed(0)} Mm³`;
  el("v-uplift").textContent = `${upliftRate().toFixed(0)} mm/d`;
  el("v-quakes").textContent = String(Math.round(quakeRate()));
  el("v-count").textContent = String(count);

  const v = el("verdict");
  if (erupting > 0) {
    v.className = "hot"; v.textContent = "erupting on the crater row.";
  } else if (volume >= band.lo) {
    v.className = "hot";
    const pct = Math.round(100 * Math.min(1, (volume - band.lo) / (band.hi - band.lo)));
    v.textContent = `inside the band, ${pct}% across it. an eruption is expected, `
      + `the day is not forecastable.`;
  } else {
    v.className = "";
    v.textContent = `below the band. at this inflow it enters in about `
      + `${((band.lo - volume) / inflow).toFixed(0)} s.`;
  }

  // The read-back: where in its band each eruption actually fell.
  const hist = el("history");
  if (!erupted.length) {
    hist.textContent = "no eruption yet in this run.";
  } else {
    const shown = erupted.slice(-3);
    const first = count - shown.length + 1;
    hist.innerHTML = shown.map((e, i) => {
      const pct = Math.round(100 * (e.vol - e.lo) / (e.hi - e.lo));
      return `${first + i}: erupted at ${e.vol.toFixed(1)}, `
        + `band ${e.lo.toFixed(0)}–${e.hi.toFixed(0)} (${pct}% across)`;
    }).join("<br>");
  }

  const e = LADDER[noteForVolume()];
  const [r, g, b] = hexRgb(e.hex);
  el("note").innerHTML = `<span style="color:rgb(${r},${g},${b})">&#9679;</span> ${e.note}`;
  el("scalebar").textContent =
    `reservoir ~${RESERVOIR_KM} km deep · ${SPAN_KM} km of ground · uplift exaggerated`;
}

// ---------- sound ----------------------------------------------------------
let ac = null, master = null, drone = null, droneGain = null, droneFilt = null;
let soundOn = false;
function audioInit() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.0001; master.connect(ac.destination);
  // The drone tracks accumulated volume, so the room hears the system loading.
  drone = ac.createOscillator(); drone.type = "sawtooth";
  droneFilt = ac.createBiquadFilter(); droneFilt.type = "lowpass";
  droneFilt.frequency.value = 220; droneFilt.Q.value = 6;
  droneGain = ac.createGain(); droneGain.gain.value = 0.05;
  drone.frequency.value = LADDER[0].f;
  drone.connect(droneFilt).connect(droneGain).connect(master);
  drone.start();
}
function playBurst() {
  if (!ac || !soundOn) return;
  const t0 = ac.currentTime;
  for (let i = 0; i < 7; i++) {
    const e = LADDER[Math.min(TOP, 5 + i * 2)];
    const when = t0 + i * 0.085;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.075, when + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 2.6);
    const o = ac.createOscillator();
    o.type = i % 2 ? "triangle" : "sine";
    o.frequency.value = e.f;
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = Math.min(6000, e.f * 6);
    o.connect(lp).connect(g).connect(master);
    o.start(when); o.stop(when + 2.8);
  }
}

// ---------- loop -----------------------------------------------------------
let prev = null, playing = true;
function frame(ms) {
  if (prev === null) prev = ms;
  const dt = Math.min(0.05, (ms - prev) / 1000); prev = ms;

  if (playing) {
    clock += dt;
    if (erupting > 0) {
      erupting -= dt;
      volume = Math.max(0.4, volume - dt * 2.6);      // the reservoir drains
      if (erupting <= 0) {
        // Between cycles the band is re-estimated and the inflow decays, both
        // as the real series did. The gate moves; the precursor still works.
        band = { lo: band.lo + 0.9 + Math.random() * 0.6,
                 hi: band.hi + 0.5 + Math.random() * 0.7 };
        inflow *= 0.94;
      }
    } else {
      volume += inflow * dt;
      if (Math.random() < hazardOf(volume) * dt) erupt();
    }

    sinceSample += dt;
    if (sinceSample > 0.3) {
      sinceSample = 0;
      trace.push({ t: clock, volume, erupt: false });
      while (trace.length && trace[0].t < clock - TRACE_SPAN - 5) trace.shift();
    }

    if (ac && soundOn) {
      const load = Math.min(1.2, volume / band.hi);
      drone.frequency.setTargetAtTime(LADDER[0].f * (1 + 1.9 * load), ac.currentTime, 0.4);
      droneFilt.frequency.setTargetAtTime(150 + 900 * load, ac.currentTime, 0.4);
      droneGain.gain.setTargetAtTime(0.02 + 0.075 * load * load, ac.currentTime, 0.4);
    }
  }

  drawScene(dt);
  drawTrace();
  updatePanel();
  requestAnimationFrame(frame);
}

el("pause").addEventListener("click", ev => {
  playing = !playing;
  ev.target.textContent = playing ? "pause" : "resume";
});
el("sound").addEventListener("click", ev => {
  if (!ac) audioInit();
  if (ac.state === "suspended") ac.resume();
  soundOn = !soundOn;
  master.gain.setTargetAtTime(soundOn ? 0.85 : 0.0001, ac.currentTime, 0.2);
  ev.target.textContent = soundOn ? "sound off" : "sound on";
});

const hud = document.getElementById("hud");
let restTimer = null;
function wake() {
  hud.classList.remove("rest");
  clearTimeout(restTimer);
  restTimer = setTimeout(() => hud.classList.add("rest"), 6000);
}
window.addEventListener("pointermove", wake);
wake();

requestAnimationFrame(frame);
})();
</script>
</body>
