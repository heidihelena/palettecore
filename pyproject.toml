[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "palettecore"
version = "0.3.0"
description = "Derive, optimise and audit a scientific colour palette from one seed colour"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Heidi Helena Andersén" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
keywords = ["color", "colour", "palette", "colorblind", "CVD", "CIEDE2000", "OKLCH", "accessibility", "dataviz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/heidihelena/palettecore"

[project.scripts]
palettecore = "palettecore.__main__:main"

[tool.setuptools]
packages = ["palettecore"]
