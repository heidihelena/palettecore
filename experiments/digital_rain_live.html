<title>digital rain — live</title>
<!--
  Digital rain — live variant: the screen starts the rain.

  Interactive art for a shared space. The page analyses whatever is playing
  in the room (microphone) or a dropped audio file, and every drop is BORN
  wearing the colour of the music at that moment: dominant pitch class ->
  hue, spectral register -> octave, on the 48-note C2..B5 helix generated and
  audited by experiments/digital_rain.py. Loudness thickens the rain; onsets
  release a bright drop; a drop sounds its note as it reaches the bottom.

  When the room goes quiet the rain does not stop. It falls back to the
  chromatic drift the other builds use, so silence still descends in order:
  "Rain keeps translating silence."

  Analysis is a folded chromagram (FFT magnitudes binned into 12 pitch
  classes over ~55-2100 Hz) with a spectral-centroid register estimate —
  robust for polyphonic music, and honest: it claims a dominant pitch class,
  not a transcription. Nothing is recorded or sent anywhere; audio stays in
  the analyser node.

  Same caveat as the study build: pitch class -> hue is a designed
  convention, and while the 48 colours clear the exploratory dE 6 floor in
  normal vision they collapse under every simulated dichromacy (see
  output/digital_rain.json). This is art, not an accessible encoding.

  Office setup: fullscreen kiosk (F11 / kiosk mode), click "listen", allow
  the microphone. Grant persists per origin on most kiosk setups.
-->

(() => {
"use strict";
if (!DATA) { document.getElementById("title").textContent =
  "palette not injected — run experiments/digital_rain.py"; return; }

const NOTES = DATA.notes;                 // C2..B5, 48 entries, chromatic
const OCTAVES = 4;
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const GLYPHS = [..."ABCDEFG", "♯", "♭", ..."2345", ..."│─┼·•▫▪"];
const glyph = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

const stateEl = document.getElementById("state");

// ---------- listening: folded chromagram + register + onsets ---------------
// FMIN reaches below C2 (65.4 Hz) because C2 is the lowest note the piece owns.
const FMIN = 55, FMAX = 2100;
let ac = null, analyser = null, freqData = null, timeData = null, prevMag = null;
let srcNode = null, fileAudio = null, master = null;
const chroma = new Float32Array(12);
let energy = 0, centroidOct = 2, confidence = 0, onsetFlux = 0, fluxAvg = 0.01;
let listening = false;

function attachSource(node) {
  if (srcNode) try { srcNode.disconnect(); } catch (e) {}
  srcNode = node;
  node.connect(analyser);
}
function audioInit() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0.5;
  freqData = new Float32Array(analyser.frequencyBinCount);
  timeData = new Float32Array(analyser.fftSize);
  prevMag = new Float32Array(analyser.frequencyBinCount);
  master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
}
async function startMic() {
  audioInit();
  await ac.resume();
  const stream = await navigator.mediaDevices.getUserMedia(
    { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  attachSource(ac.createMediaStreamSource(stream));
  listening = true;
  stateEl.textContent = "listening";
}
function startFile(f) {
  audioInit();
  ac.resume();
  if (fileAudio) fileAudio.pause();
  fileAudio = new Audio(URL.createObjectURL(f));
  fileAudio.loop = true;
  const node = ac.createMediaElementSource(fileAudio);
  attachSource(node);
  node.connect(ac.destination);            // the room hears the file too
  fileAudio.play();
  listening = true;
  stateEl.textContent = "playing: " + f.name.toLowerCase();
}

function listen() {
  if (!listening) return;
  analyser.getFloatFrequencyData(freqData);
  analyser.getFloatTimeDomainData(timeData);

  let rms = 0;
  for (let i = 0; i < timeData.length; i++) rms += timeData[i] * timeData[i];
  rms = Math.sqrt(rms / timeData.length);
  energy += 0.1 * (rms - energy);

  const binHz = ac.sampleRate / analyser.fftSize;
  const raw = new Float32Array(12);
  let csum = 0, cmagsum = 0, flux = 0;
  const i0 = Math.max(1, Math.floor(FMIN / binHz));
  const i1 = Math.min(freqData.length - 1, Math.ceil(FMAX / binHz));
  for (let i = i0; i <= i1; i++) {
    const mag = Math.pow(10, freqData[i] / 20);
    const f = i * binHz;
    const pc = ((Math.round(12 * Math.log2(f / 65.41)) % 12) + 12) % 12;   // C2 datum
    raw[pc] += mag;
    csum += f * mag; cmagsum += mag;
    const d = mag - prevMag[i];
    if (d > 0) flux += d;
    prevMag[i] = mag;
  }
  fluxAvg += 0.02 * (flux - fluxAvg);
  onsetFlux = flux / (fluxAvg + 1e-9);

  let tot = 0, mx = 0;
  for (let p = 0; p < 12; p++) {
    chroma[p] += 0.15 * (raw[p] - chroma[p]);
    tot += chroma[p]; mx = Math.max(mx, chroma[p]);
  }
  confidence = tot > 1e-7 && energy > 0.004 ? mx / (tot / 12) : 0;
  if (cmagsum > 1e-7) {
    const oct = Math.log2((csum / cmagsum) / 65.41);      // octaves above C2
    centroidOct += 0.1 * (Math.min(OCTAVES - 1, Math.max(0, oct)) - centroidOct);
  }
}
function dominantIndex() {
  let p = 0;
  for (let i = 1; i < 12; i++) if (chroma[i] > chroma[p]) p = i;
  const octave = Math.min(OCTAVES - 1, Math.max(0, Math.round(centroidOct)));
  return Math.min(NOTES.length - 1, 12 * octave + p);
}

// ---------- idle drift: the rain never stops ------------------------------
// "Rain keeps translating silence." A quiet room falls back to the chromatic
// walk the other builds use, so the piece still climbs C2 upward on its own.
let idleWalk = 0, idleUp = true;
function idleStep() {
  idleWalk += idleUp ? 1 : -1;
  if (idleWalk >= NOTES.length - 1) { idleWalk = NOTES.length - 1; idleUp = false; }
  if (idleWalk <= 0) { idleWalk = 0; idleUp = true; }
  return idleWalk;
}
const noteNow = () => (listening && confidence > 1.6) ? dominantIndex() : idleStep();

// ---------- the fall -------------------------------------------------------
const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");
const CELL = 19, COLW = 24;
let W = 0, H = 0, COLS = 0, ROWS = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  COLS = Math.max(1, Math.floor(W / COLW));
  ROWS = Math.max(1, Math.floor(H / CELL));
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
}
resize();
window.addEventListener("resize", resize);

let drops = [], lastNote = 0, sinceSpawn = 0, loud = 0, prev = null;
const MAX_DROPS = 460;

function spawn(noteIdx, bright) {
  const len = 10 + ((Math.random() * 16) | 0);
  drops.push({
    note: noteIdx, col: (Math.random() * COLS) | 0,
    y: -len * CELL * Math.random(),
    speed: (85 + Math.random() * 120) * (0.8 + 0.9 * loud), len, bright: !!bright,
    chars: Array.from({ length: len }, glyph), struck: false,
  });
  if (drops.length > MAX_DROPS) drops.shift();
}

function strike(entry) {
  if (!ac || !listening) return;             // the room already supplies the sound
  const when = ac.currentTime, g = ac.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.03, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 1.6);
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = Math.min(5200, entry.f * 7);
  const o = ac.createOscillator();
  o.type = "sine"; o.frequency.value = entry.f;
  o.connect(lp); o.start(when); o.stop(when + 1.8);
  lp.connect(g).connect(master);
}

const hud = document.getElementById("hud");
const noteEl = document.getElementById("note");

function frame(ms) {
  if (prev === null) prev = ms;
  const dt = Math.min(0.05, (ms - prev) / 1000); prev = ms;
  listen();
  loud += 0.12 * (Math.min(1, energy * 6) - loud);

  // Loudness thickens the rain; a quiet room still drizzles.
  sinceSpawn += dt;
  const gap = 0.16 - 0.125 * loud;
  if (sinceSpawn >= gap) { sinceSpawn = 0; spawn(noteNow()); }
  if (listening && onsetFlux > 2.2) spawn(noteNow(), true);

  ctx.fillStyle = "rgba(0,0,0,0.11)";
  ctx.fillRect(0, 0, W, H);
  ctx.font = `500 ${CELL - 3}px "Nudica Mono", ui-monospace, monospace`;
  ctx.textBaseline = "top";

  for (const d of drops) {
    d.y += d.speed * dt;
    const [r, g, b] = hexRgb(NOTES[d.note].hex);
    const headRow = Math.floor(d.y / CELL);
    for (let k = 0; k < d.len; k++) {
      const row = headRow - k;
      if (row < 0 || row >= ROWS) continue;
      const fade = Math.pow(1 - k / d.len, 1.5);
      const w = k === 0 ? (d.bright ? 0.94 : 0.8) : k === 1 ? 0.36 : 0;
      ctx.fillStyle = `rgba(${Math.round(r + (255 - r) * w)},${
        Math.round(g + (255 - g) * w)},${Math.round(b + (255 - b) * w)},${
        (0.14 + 0.86 * fade).toFixed(3)})`;
      if (Math.random() < 0.03) d.chars[k] = glyph();
      ctx.fillText(d.chars[k], d.col * COLW + 5, row * CELL);
    }
    if (!d.struck && d.y >= H) { d.struck = true; lastNote = d.note; strike(NOTES[d.note]); }
  }
  drops = drops.filter(d => d.y - d.len * CELL < H + CELL);

  const e = NOTES[listening && confidence > 1.6 ? dominantIndex() : lastNote];
  const [r, g, b] = hexRgb(e.hex);
  noteEl.innerHTML = `<span style="color:rgb(${r},${g},${b})">&#9679;</span> ${e.note}`;
  requestAnimationFrame(frame);
}

document.getElementById("mic").addEventListener("click", () =>
  startMic().catch(e => {
    stateEl.textContent = "microphone unavailable — " + String(e.name || e).toLowerCase();
  }));
document.getElementById("file").addEventListener("click", () =>
  document.getElementById("filepick").click());
document.getElementById("filepick").addEventListener("change", ev => {
  if (ev.target.files[0]) startFile(ev.target.files[0]);
});
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && f.type.startsWith("audio")) startFile(f);
});

let restTimer = null;
function wake() {
  hud.classList.remove("rest");
  clearTimeout(restTimer);
  restTimer = setTimeout(() => hud.classList.add("rest"), 5000);
}
window.addEventListener("pointermove", wake);
wake();

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
